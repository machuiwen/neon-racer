<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neon Racer">
  <meta name="theme-color" content="#12002a">
  <meta name="description" content="A neon synthwave racing game for the browser. Works with keyboard or touch.">
  <title>Neon Racer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312002a'/%3E%3Cpath d='M10 44 L22 18 H42 L54 44 Z' fill='none' stroke='%23ff2ea6' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M32 22 V42' stroke='%2318e0ff' stroke-width='4' stroke-dasharray='5 4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="confetti"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-tl">
      <div class="pos"><span id="hud-pos">4<sup>th</sup></span><span id="hud-posof">/4</span></div>
      <div id="hud-lap" class="lap">LAP 1/3</div>
      <div id="hud-stars" class="stars">&#9733; 0</div>
      <canvas id="minimap"></canvas>
    </div>
    <div class="hud-tr">
      <div id="hud-time" class="time">0:00.00</div>
      <div id="hud-best" class="sub">BEST -:--.--</div>
      <div id="hud-last" class="sub"></div>
    </div>
    <div class="hud-bc">
      <div class="speedo"><span id="hud-speed">0</span><span class="unit">KM/H</span></div>
      <div id="hud-boost" class="boostbar"><div id="hud-boostfill"></div><span>BOOST</span></div>
    </div>
    <div id="wrongway">Wrong way! Turn around</div>
  </div>

  <div id="toast"></div>
  <div id="countdown"></div>

  <div id="touch" class="hidden">
    <div class="tc tc-left">
      <div class="tbtn steer" data-k="left" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" /></svg></div>
      <div class="tbtn steer" data-k="right" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" /></svg></div>
    </div>
    <div class="tc tc-right">
      <div class="tcol">
        <div class="tbtn boost" data-k="boost">BOOST</div>
        <div class="tbtn brake" data-k="brake">BRAKE</div>
      </div>
      <div class="tbtn gas" id="tbtn-gas" data-k="gas">GO</div>
    </div>
  </div>

  <div id="topbtns">
    <button id="btn-mute" class="icon-btn" aria-label="Sound on or off">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" class="fill"/><path d="M16 9 Q18.5 12 16 15 M18.5 6.5 Q23 12 18.5 17.5"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" class="fill"/><path d="M16.5 9.5 L21.5 14.5 M21.5 9.5 L16.5 14.5"/></svg>
    </button>
    <button id="btn-pause" class="icon-btn hidden" aria-label="Pause">
      <svg viewBox="0 0 24 24"><path d="M8 5 V19 M16 5 V19" style="stroke-width:4"/></svg>
    </button>
  </div>

  <div id="title" class="screen hidden">
    <div class="panel">
      <h1 class="logo"><span class="l1">NEON</span><span class="l2">RACER</span></h1>
      <p class="tag">Race through the neon night!</p>
      <div class="group">
        <div class="label">Pick your car</div>
        <div id="swatches" class="swatches"></div>
      </div>
      <div class="row">
        <div class="group">
          <div class="label">Level</div>
          <div class="seg" id="seg-diff">
            <button data-v="easy">Easy</button><button data-v="normal">Normal</button><button data-v="hard">Hard</button>
          </div>
        </div>
        <div class="group">
          <div class="label">Laps</div>
          <div class="seg" id="seg-laps">
            <button data-v="1">1</button><button data-v="3">3</button><button data-v="5">5</button>
          </div>
        </div>
      </div>
      <button id="btn-autogas" class="toggle"><span class="box"></span><span>Auto gas: just steer!</span></button>
      <button id="btn-start" class="big-btn">RACE!</button>
      <div class="best" id="title-best"></div>
      <div class="help" id="help"></div>
    </div>
  </div>

  <div id="pause" class="screen center hidden">
    <div class="card">
      <div class="card-title">Paused</div>
      <div class="btns col">
        <button id="btn-resume" class="big-btn">Keep racing</button>
        <button id="btn-restart" class="btn2">Restart race</button>
        <button id="btn-quit" class="btn2">Main menu</button>
      </div>
    </div>
  </div>

  <div id="results" class="screen center hidden">
    <div class="card">
      <div id="res-place" class="place">1st</div>
      <div id="res-msg" class="msg">You won!</div>
      <div id="res-table" class="table"></div>
      <div id="res-stats" class="stats"></div>
      <div class="btns">
        <button id="btn-again" class="big-btn">Race again</button>
        <button id="btn-menu" class="btn2">Menu</button>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="logo small"><span class="l1">NEON</span><span class="l2">RACER</span></div>
    <div id="load-msg">Loading...</div>
  </div>

  <script>
    setTimeout(function () {
      var m = document.getElementById('load-msg');
      if (m && document.getElementById('loading')) m.textContent = 'Still loading... please check your internet connection.';
    }, 15000);
    window.addEventListener('error', function (e) {
      var m = document.getElementById('load-msg');
      if (m && document.getElementById('loading')) m.textContent = 'Oops, something went wrong: ' + (e.message || 'unknown error');
    });
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
