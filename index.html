<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="霓虹赛车">
  <meta name="theme-color" content="#12002a">
  <meta name="description" content="A neon synthwave racing game for the browser. Works with keyboard or touch.">
  <title>霓虹赛车 Neon Racer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312002a'/%3E%3Cpath d='M10 44 L22 18 H42 L54 44 Z' fill='none' stroke='%23ff2ea6' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M32 22 V42' stroke='%2318e0ff' stroke-width='4' stroke-dasharray='5 4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="confetti"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-tl">
      <div class="pos"><span id="hud-pos"><sup>第</sup>4<sup>名</sup></span><span id="hud-posof">/4</span></div>
      <div id="hud-lap" class="lap">圈数 1/3</div>
      <div id="hud-stars" class="stars">&#9733; 0</div>
      <canvas id="minimap"></canvas>
    </div>
    <div class="hud-tr">
      <div id="hud-time" class="time">0:00.00</div>
      <div id="hud-best" class="sub">最快 -:--.--</div>
      <div id="hud-last" class="sub"></div>
    </div>
    <div class="hud-bc">
      <div class="speedo"><span id="hud-speed">0</span><span class="unit">公里/时</span></div>
      <div id="hud-boost" class="boostbar"><div id="hud-boostfill"></div><span>加速</span></div>
    </div>
    <div id="wrongway">方向反了！快掉头</div>
  </div>

  <div id="toast"></div>
  <div id="countdown"></div>

  <div id="touch" class="hidden">
    <div class="tc tc-left">
      <div class="tbtn steer" data-k="left" aria-label="向左"><svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" /></svg></div>
      <div class="tbtn steer" data-k="right" aria-label="向右"><svg viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" /></svg></div>
    </div>
    <div class="tc tc-right">
      <div class="tcol">
        <div class="tbtn boost" data-k="boost">加速</div>
        <div class="tbtn brake" data-k="brake">刹车</div>
      </div>
      <div class="tbtn gas" id="tbtn-gas" data-k="gas">油门</div>
    </div>
  </div>

  <div id="topbtns">
    <button id="btn-mute" class="icon-btn" aria-label="声音开关">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" class="fill"/><path d="M16 9 Q18.5 12 16 15 M18.5 6.5 Q23 12 18.5 17.5"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" class="fill"/><path d="M16.5 9.5 L21.5 14.5 M21.5 9.5 L16.5 14.5"/></svg>
    </button>
    <button id="btn-pause" class="icon-btn hidden" aria-label="暂停">
      <svg viewBox="0 0 24 24"><path d="M8 5 V19 M16 5 V19" style="stroke-width:4"/></svg>
    </button>
  </div>

  <div id="title" class="screen hidden">
    <div class="panel">
      <h1 class="logo"><span class="l1">NEON</span><span class="l2">RACER</span></h1>
      <p class="tag">在霓虹之夜飞驰吧！</p>
      <div class="group">
        <div class="label">选择你的赛车</div>
        <div id="swatches" class="swatches"></div>
      </div>
      <div class="row">
        <div class="group">
          <div class="label">难度</div>
          <div class="seg" id="seg-diff">
            <button data-v="easy">简单</button><button data-v="normal">普通</button><button data-v="hard">困难</button>
          </div>
        </div>
        <div class="group">
          <div class="label">圈数</div>
          <div class="seg" id="seg-laps">
            <button data-v="1">1</button><button data-v="3">3</button><button data-v="5">5</button>
          </div>
        </div>
      </div>
      <button id="btn-autogas" class="toggle"><span class="box"></span><span>自动油门：只管转方向！</span></button>
      <button id="btn-start" class="big-btn">开始比赛！</button>
      <div class="best" id="title-best"></div>
      <div class="help" id="help"></div>
    </div>
  </div>

  <div id="pause" class="screen center hidden">
    <div class="card">
      <div class="card-title">暂停中</div>
      <div class="btns col">
        <button id="btn-resume" class="big-btn">继续比赛</button>
        <button id="btn-restart" class="btn2">重新开始</button>
        <button id="btn-quit" class="btn2">主菜单</button>
      </div>
    </div>
  </div>

  <div id="results" class="screen center hidden">
    <div class="card">
      <div id="res-place" class="place">第1名</div>
      <div id="res-msg" class="msg">你赢了！</div>
      <div id="res-table" class="table"></div>
      <div id="res-stats" class="stats"></div>
      <div class="btns">
        <button id="btn-again" class="big-btn">再来一局</button>
        <button id="btn-menu" class="btn2">菜单</button>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="logo small"><span class="l1">NEON</span><span class="l2">RACER</span></div>
    <div id="load-msg">加载中…</div>
  </div>

  <script>
    setTimeout(function () {
      var m = document.getElementById('load-msg');
      if (m && document.getElementById('loading')) m.textContent = '还在加载…请检查网络连接。';
    }, 15000);
    window.addEventListener('error', function (e) {
      var m = document.getElementById('load-msg');
      if (m && document.getElementById('loading')) m.textContent = '哎呀，出错了：' + (e.message || '未知错误');
    });
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
